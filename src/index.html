<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interactivo de Ibagué</title>
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./output.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Lucide Icons (usando CDN) -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        .leaflet-container {
            height: 100vh;
            width: 100%;
            z-index: 0;
        }
    </style>
</head>
<body>
    <!-- El mapa se creará aquí -->
    <div id="map"></div>
    
    <!-- Panel de información (inicialmente oculto) -->
    <div id="infoPanel" class="hidden absolute top-4 right-4 w-96 bg-white rounded-lg shadow-2xl p-6 max-h-96 overflow-y-auto z-[1000]">
        <!-- Se llenará con JavaScript -->
    </div>
    
    <!-- Script principal -->
    <script src="./mapa.js"></script>
    
    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();
    </script>
</body>
</html>
